<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Chèques</title>
    <!-- Ajout de Bootstrap pour un joli design de tableau de bord -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">💳 Saisir un nouveau chèque péage</h4>
                </div>
                <div class="card-body">
                    
                    <!-- Affichage des messages de succès -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <!-- Le formulaire -->
                    <form method="POST">
                        {% csrf_token %} <!-- Sécurité obligatoire de Django -->
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Numéro du chèque</label>
                            {{ form.numero_cheque }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Matricule du camion</label>
                            {{ form.matricule }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Date de remise</label>
                            {{ form.date_remise }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Montant initial (MAD)</label>
                            {{ form.montant_initial }}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3">Enregistrer le chèque</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
